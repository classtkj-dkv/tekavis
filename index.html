  <script>
    // Registrasi service worker buat kemampuan PWA (install ke home screen,
    // asset statis kebuka instan). Dibungkus try/catch + event 'load' biar
    // gak pernah nge-block/nge-lambatin render halaman, dan gak error di
    // console kalau browsernya gak support atau lagi di http (bukan https).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('Service worker gagal didaftarkan:', err.message);
        });
      });
    }
  </script>
